# Gateway-owned model routes. Credential sources are external to this file:
# ChatGPT OAuth uses ~/.config/llm/chatgpt/auth.json; other provider secrets
# use their configured environment variables.
models:
  - id: gpt-6.1-sol
    mode: responses
    upstream_model: gpt-6.1-sol
    api_base: https://chatgpt.com/backend-api/codex
    authorization: chatgpt

  - id: gpt-6-luna
    mode: responses
    upstream_model: gpt-6-luna
    api_base: https://chatgpt.com/backend-api/codex
    authorization: chatgpt

  - id: opencode-go/deepseek-flash
    mode: responses
    upstream_model: deepseek-flash
    api_base_env: OPENCODEGO_API_BASE
    api_base: https://opencode.ai/zen/go/v1
    api_key_env: OPENCODEGO_API_KEY
    compatibility: opencode-go

  - id: sonnet-5.5
    mode: messages
    upstream_model: claude-sonnet-5-5
    api_base: https://kitool.ai
    api_key_env: KITOOL_API_KEY
    codex_responses: true
