name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate repository basics
        run: |
          test -f README.md || (echo "README missing" && exit 1)
          test -f LICENSE || test -f LICENSE.md || (echo "LICENSE missing" && exit 1)
          echo "basic checks passed"
