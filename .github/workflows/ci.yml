name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v7
      - name: Check bilingual documentation pairs
        working-directory: .
        run: python3 scripts/check_doc_pairs.py
      - name: Validate repository basics
        working-directory: .
        run: |
          test -f README.md || (echo "README missing" && exit 1)
          test -f LICENSE || test -f LICENSE.md || (echo "LICENSE missing" && exit 1)
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Sync locked dependencies
        run: uv sync --locked --group dev
      - name: Provide Linux listener inspection compatibility
        working-directory: .
        run: |
          mkdir -p "$RUNNER_TEMP/netstat-compat"
          cat > "$RUNNER_TEMP/netstat-compat/netstat" <<'EOF'
          #!/usr/bin/env bash
          exec python "$GITHUB_WORKSPACE/.github/scripts/netstat_compat.py" "$@"
          EOF
          chmod +x "$RUNNER_TEMP/netstat-compat/netstat"
          echo "$RUNNER_TEMP/netstat-compat" >> "$GITHUB_PATH"
      - name: Run gateway and conformance tests
        run: uv run pytest -ra

  windows-credential-security:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Sync locked dependencies
        run: uv sync --locked --group dev
      - name: Verify NTFS credential ACLs, startup proxies, and log redaction
        run: uv run pytest -q tests/test_credential_security.py tests/test_gateway_proxy.py tests/test_secure_logging.py
