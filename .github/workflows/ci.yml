name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: litellm
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: litellm/.python-version
      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv
      - name: Sync locked dependencies
        run: uv sync --locked
      - name: Run conformance and unit tests
        run: uv run pytest -k "not test_08_loopback_binding_only"
