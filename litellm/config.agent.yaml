# Codex 模型路由桥接配置：Codex → LiteLLM → ChatGPT GPT family。
#
# model_list 中 BEGIN/END GENERATED GPT MODELS 之间的内容由
# sync-agent-gpt-models.ps1 生成；同一脚本也生成 Codex 的过滤模型目录。
#
# 安全约定：
# - 密钥只经环境变量注入，绝不写入本文件/日志/仓库。
# - 仅绑定 127.0.0.1；默认无 master key（本地信任模型）。
# - num_retries=0：重试所有权归调用方（Codex/daemon），LiteLLM 只转发一次。
model_list:
  # BEGIN GENERATED GPT MODELS
  - model_name: 'gpt-5.6-sol'
    model_info:
      mode: responses
    litellm_params:
      model: 'chatgpt/gpt-5.6-sol'
      timeout: 120
  - model_name: 'gpt-5.6-terra'
    model_info:
      mode: responses
    litellm_params:
      model: 'chatgpt/gpt-5.6-terra'
      timeout: 120
  - model_name: 'gpt-5.6-luna'
    model_info:
      mode: responses
    litellm_params:
      model: 'chatgpt/gpt-5.6-luna'
      timeout: 120
  - model_name: 'gpt-5.5'
    model_info:
      mode: responses
    litellm_params:
      model: 'chatgpt/gpt-5.5'
      timeout: 120
  - model_name: 'gpt-5.4'
    model_info:
      mode: responses
    litellm_params:
      model: 'chatgpt/gpt-5.4'
      timeout: 120
  - model_name: 'gpt-5.4-mini'
    model_info:
      mode: responses
    litellm_params:
      model: 'chatgpt/gpt-5.4-mini'
      timeout: 120
  # END GENERATED GPT MODELS
litellm_settings:
  cache: false
  callbacks: []
  success_callback: []
  failure_callback: []
  turn_off_message_logging: true
  suppress_debug_info: true
  telemetry: false
general_settings:
  store_model_in_db: false
  cancel_on_disconnect: true
router_settings:
  num_retries: 0
