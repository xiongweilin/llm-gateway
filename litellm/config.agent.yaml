# Codex 模型路由桥接配置：Codex → LiteLLM → ChatGPT GPT family / OpenCode Go。
#
# model_list 中 BEGIN/END GENERATED GPT MODELS 之间的内容由
# sync-agent-gpt-models.ps1 从 Codex 运行时目录按统一三模型白名单生成；
# models_cache.json、models.json 与本文件的 GPT model_list 保持一致；
# OpenCode Go supplemental route 位于生成区块之外，由本模板持有。
#
# 安全约定：
# - 密钥只经环境变量注入，绝不写入本文件/日志/仓库。
# - 仅绑定 127.0.0.1；默认无 master key（本地信任模型）。
# - num_retries=0：重试所有权归调用方（Codex/daemon），LiteLLM 只转发一次。
model_list:
  # BEGIN GENERATED GPT MODELS
  - model_name: 'gpt-5.6-sol'
    model_info:
      mode: responses
    litellm_params:
      model: 'chatgpt/gpt-5.6-sol'
      timeout: 900
  - model_name: 'gpt-5.6-terra'
    model_info:
      mode: responses
    litellm_params:
      model: 'chatgpt/gpt-5.6-terra'
      timeout: 900
  - model_name: 'gpt-5.6-luna'
    model_info:
      mode: responses
    litellm_params:
      model: 'chatgpt/gpt-5.6-luna'
      timeout: 900
  # END GENERATED GPT MODELS
  # OpenCode Go supplemental model；密钥只从当前用户环境变量注入。
  - model_name: 'opencode-go/muse-spark-1.3-contributor'
    model_info:
      mode: responses
    litellm_params:
      model: 'openai/muse-spark-1.3-contributor'
      api_base: https://opencode.ai/zen/go/v1
      api_key: os.environ/OPENCODEGO_API_KEY
      timeout: 3600
      stream_timeout: 3600
  # Omen Alpha exposes OpenAI-compatible Chat Completions; LiteLLM bridges
  # Codex's Responses request to the provider-specific endpoint.
  - model_name: 'opencode-go/omen-alpha'
    model_info:
      mode: chat
    litellm_params:
      model: 'openai/omen-alpha'
      api_base: https://opencode.ai/zen/go/v1
      api_key: os.environ/OPENCODEGO_API_KEY
      timeout: 3600
      stream_timeout: 3600
litellm_settings:
  cache: false
  callbacks: []
  success_callback: []
  failure_callback: []
  turn_off_message_logging: true
  suppress_debug_info: true
  telemetry: false
general_settings:
  store_model_in_db: false
  cancel_on_disconnect: true
router_settings:
  num_retries: 0
