# Protocol ingress and LiteLLM routing configuration.
# The generated model_list is owned by litellm/models.yaml.
model_list:
  # BEGIN GENERATED RUNTIME MODELS
  - model_name: 'gpt-6-sol'
    model_info:
      mode: responses
    litellm_params:
      model: 'chatgpt/gpt-6-sol'
  - model_name: 'gpt-6-luna'
    model_info:
      mode: responses
    litellm_params:
      model: 'chatgpt/gpt-6-luna'
  - model_name: 'opencode-go/deepseek-flash'
    model_info:
      mode: responses
    litellm_params:
      model: 'openai/deepseek-flash'
      api_base: 'https://opencode.ai/zen/go/v1'
      api_key: 'os.environ/OPENCODEGO_API_KEY'
  # END GENERATED RUNTIME MODELS
litellm_settings:
  cache: false
  callbacks: []
  success_callback: []
  failure_callback: []
  turn_off_message_logging: true
  suppress_debug_info: true
  telemetry: false
general_settings:
  store_model_in_db: false
  cancel_on_disconnect: true
router_settings:
  num_retries: 0
  retry_policy:
    RateLimitErrorRetries: 4
