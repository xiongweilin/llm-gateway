# 协议入口配置：Responses/Chat Completions → LiteLLM → 上游模型。
#
# model_list 中 BEGIN/END GENERATED GPT MODELS 之间的内容由
# sync-agent-gpt-models.ps1 从运行时模型目录按统一三模型白名单生成；
# models_cache.json、models.json 与本文件的 GPT model_list 保持一致；
# 非生成路由位于生成区块之外，由本模板持有。
#
# 安全约定：
# - 密钥只经环境变量注入，绝不写入本文件/日志/仓库。
# - 仅绑定 127.0.0.1；默认无 master key（本地信任模型）。
# - num_retries=0：重试所有权归调用方，LiteLLM 只转发一次。
model_list:
  # BEGIN GENERATED GPT MODELS
  # END GENERATED GPT MODELS
  # Responses 路由；密钥只从当前用户环境变量注入。
  - model_name: 'opencode-go/muse-spark-1.3-contributor'
    model_info:
      mode: responses
    litellm_params:
      model: 'openai/muse-spark-1.3-contributor'
      api_base: https://opencode.ai/zen/go/v1
      api_key: os.environ/OPENCODEGO_API_KEY
      timeout: 3600
      stream_timeout: 3600
  # Responses 原生别名，供使用裸模型 ID 的客户端调用。
  - model_name: 'muse-spark-1.3-contributor'
    model_info:
      mode: responses
    litellm_params:
      model: 'openai/muse-spark-1.3-contributor'
      api_base: https://opencode.ai/zen/go/v1
      api_key: os.environ/OPENCODEGO_API_KEY
      timeout: 3600
      stream_timeout: 3600
  # Responses 兼容路由：上游只提供 Chat Completions，LiteLLM 负责协议桥接。
  - model_name: 'opencode-go/omen-alpha'
    model_info:
      mode: chat
    litellm_params:
      # 此前缀让 LiteLLM 的 Responses 入口使用 Chat Completions 桥接。
      model: 'openai/chat_completions/omen-alpha'
      # 调用方可能携带 reasoning_effort；上游不支持该参数，仅此部署丢弃。
      drop_params: true
      api_base: https://opencode.ai/zen/go/v1
      api_key: os.environ/OPENCODEGO_API_KEY
      timeout: 3600
      stream_timeout: 3600
  # Chat Completions 原生路由；入口为 127.0.0.1:4102。
  - model_name: 'omen-alpha'
    model_info:
      mode: chat
    litellm_params:
      model: 'openai/omen-alpha'
      drop_params: true
      api_base: https://opencode.ai/zen/go/v1
      api_key: os.environ/OPENCODEGO_API_KEY
      timeout: 3600
      stream_timeout: 3600
litellm_settings:
  cache: false
  callbacks: []
  success_callback: []
  failure_callback: []
  turn_off_message_logging: true
  suppress_debug_info: true
  telemetry: false
general_settings:
  store_model_in_db: false
  cancel_on_disconnect: true
router_settings:
  num_retries: 0
