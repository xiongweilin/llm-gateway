# Runtime model source of truth.
# Provider credentials are referenced by environment variable name only.
models:
  - id: 'gpt-5.6-sol'
    mode: responses
    route:
      model: 'chatgpt/gpt-5.6-sol'
  - id: 'gpt-5.6-terra'
    mode: responses
    route:
      model: 'chatgpt/gpt-5.6-terra'
  - id: 'gpt-5.6-luna'
    mode: responses
    route:
      model: 'chatgpt/gpt-5.6-luna'
  - id: 'opencode-go/muse-spark-1.3-contributor'
    mode: responses
    route:
      model: 'openai/muse-spark-1.3-contributor'
      api_base: 'https://opencode.ai/zen/go/v1'
      api_key: 'os.environ/OPENCODEGO_API_KEY'
  - id: 'opencode-go/deepseek-flash'
    mode: responses
    route:
      model: 'openai/deepseek-flash'
      api_base: 'https://opencode.ai/zen/go/v1'
      api_key: 'os.environ/OPENCODEGO_API_KEY'
  - id: 'opencode-go/omen-alpha'
    mode: chat
    route:
      model: 'openai/omen-alpha'
      drop_params: true
      api_base: 'https://opencode.ai/zen/go/v1'
      api_key: 'os.environ/OPENCODEGO_API_KEY'
